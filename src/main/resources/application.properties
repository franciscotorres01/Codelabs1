# ==========================================
# INFORMACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=cliente-service2
api.version=1

# Desactivar la gestión automática de Docker Compose (usamos el contenedor manual)
spring.docker.compose.enabled=false

# ==========================================
# SERVIDOR WEB (API REST)
# ==========================================
server.port=8080

# ==========================================
# BASE DE DATOS - PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/curso_springboot
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# POOL DE CONEXIONES - HikariCP
# ==========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=ClienteHikariPool
spring.datasource.hikari.validation-timeout=5000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ¡IMPORTANTE! Debe estar en update para no perder los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SPRING ACTUATOR (Monitoreo)
# ==========================================
management.server.port=8081
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Información personalizada para /actuator/info
info.app.name=Cliente Service API
info.app.description=API REST para gesti\u00F3n de clientes y regiones
info.app.version=1.0.0
info.app.java.version=${java.version}
info.app.spring-boot.version=4.1.1

# ==========================================
# LOGGING (Registros)
# ==========================================
logging.level.com.denkitronik=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
# CARGA DE ARCHIVOS (Subidas)
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB