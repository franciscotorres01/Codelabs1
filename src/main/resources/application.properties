spring.application.name=cliente-service2
api.version=1
spring.docker.compose.enabled=false
server.port=8080

# Configuración H2 Básica (Sin MODE=PostgreSQL para evitar conflictos de sintaxis)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate y creación de tablas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Forzar la ejecución del import.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always