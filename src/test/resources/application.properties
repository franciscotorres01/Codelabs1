# Configuración para pruebas
spring.application.name=cliente-service2-test
api.version=1

# Desactivar Docker Compose en pruebas
spring.docker.compose.enabled=false

# Base de datos en memoria (H2) para que funcione sin Docker ni Postgres
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Si import.sql necesita ejecutarse después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Evita choques de puerto con el actuator
management.server.port=0