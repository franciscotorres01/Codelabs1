# Configuración para pruebas
spring.application.name=cliente-service2-test
api.version=1

# Desactivar Docker Compose en pruebas
spring.docker.compose.enabled=false

# Base de datos de pruebas (PostgreSQL en Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/curso_springboot_test
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# En pruebas se usa 'create-drop' para que la base de datos se cree y se borre automáticamente al terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true