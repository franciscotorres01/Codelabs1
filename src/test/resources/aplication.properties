# Configuración exclusiva para el entorno de pruebas (CI)
spring.application.name=cliente-service2-test
api.version=1

# Usar H2 en memoria en lugar de PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactivar la gestión automática de Docker en pruebas
spring.docker.compose.enabled=false

# Evitar conflictos de puerto con el actuador en CI
management.server.port=0